name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bluepill-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build firmware
        run: make all
      - name: Reproducible build
        run: make reproducible
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halaos-bluepill
          path: |
            out/build/halaos-bluepill.elf
            out/build/halaos-bluepill.bin
            out/build/halaos-bluepill.map
            out/build/resource-report.json
